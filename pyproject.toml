[project]
name = "sitewrap"
version = "0.1.0"
description = "SiteWrap: turn websites into standalone app windows (QtWebEngine, per-site profiles, capped scopes)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyside6>=6.6.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-qt>=4.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
